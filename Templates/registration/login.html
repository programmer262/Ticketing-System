<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Access Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-dark">Support Hub Log In</h3>
                        <p class="text-muted small">Enter credentials to access your terminal dashboard</p>
                    </div>

                    {% if form.errors %}
                        <div class="alert alert-danger small py-2" role="alert">
                            Your username and password didn't match. Please try again.
                        </div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_username" class="form-label small fw-semibold">Username</label>
                            <input type="text" name="username" id="id_username" class="form-control" placeholder="e.g. agent_alice" required autocomplete="username">
                        </div>

                        <div class="mb-4">
                            <label for="id_password" class="form-label small fw-semibold">Password</label>
                            <input type="password" name="password" id="id_password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold shadow-sm">
                            Sign In
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="text-center mt-3">
                <a href="/admin/" class="text-muted small text-decoration-none">← System Admin Panel</a>
            </div>
        </div>
    </div>

</body>
</html>
