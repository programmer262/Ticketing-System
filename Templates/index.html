<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Please Select Your Portal</title>
    <style>
        /* Modern Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            padding: 20px;
        }

        /* Dark mode preference support */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #141e30 0%, #243b55 100%);
                color: #fff;
            }
        }

        /* Container Card */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 3rem 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 450px;
            width: 100%;
        }

        /* Typography */
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 2.5rem;
        }

        /* Button Group & Styling */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            display: block;
            text-decoration: none;
            padding: 1rem 2rem;
            font-size: 1.05rem;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        /* Customer Button (Primary Accent) */
        .btn-customer {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-customer:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
        }

        /* Agent Button (Outline/Secondary) */
        .btn-agent {
            background-color: transparent;
            color: #2563eb;
            border: 2px solid #2563eb;
        }

        @media (prefers-color-scheme: dark) {
            .btn-agent {
                color: #60a5fa;
                border-color: #60a5fa;
            }
        }

        .btn-agent:hover {
            background-color: rgba(37, 99, 235, 0.05);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome</h1>
        <p>Please select your portal to continue</p>

        <div class="btn-group">
            <!-- Replace 'https://customer.example.com' with your actual redirect link -->
            <a href="{% url 'create_ticket' %}" class="btn btn-customer">A Customer</a>

            <!-- Replace 'https://agent.example.com' with your actual redirect link -->
            <a href="{% url 'agent_workspace' %}" class="btn btn-agent">An Agent</a>
        </div>
    </div>

</body>

</html>
