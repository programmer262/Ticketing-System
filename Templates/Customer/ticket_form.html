<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Support Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4">
                        <h2 class="card-title fw-bold text-dark mb-1">Create Support Ticket</h2>
                        <p class="text-muted mb-4">Our agentic support co-pilot will review your issue immediately.</p>
                        
                        <form method="POST">
                            {% csrf_token %} <div class="mb-3">
                                <label class="form-label fw-semibold">Ticket Title</label>
                                {{ form.title }}
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Category</label>
                                {{ form.category }}
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Problem Details</label>
                                {{ form.initial_message }}
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                Submit Ticket
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
